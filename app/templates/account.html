{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="kicker">Account</p>
    <h1>{{ user.name }}</h1>
    <p class="help">{{ user.email }} · {{ ROLE_LABELS.get(user.role, user.role) }}</p>
  </div>
</header>
<form method="post" action="/account" class="card stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h2>Change password</h2>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <label>
    <span>Current password</span>
    <input type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label>
    <span>New password</span>
    <input type="password" name="new_password" autocomplete="new-password" required minlength="10">
  </label>
  <label>
    <span>Confirm new password</span>
    <input type="password" name="confirm" autocomplete="new-password" required minlength="10">
  </label>
  <button class="btn" type="submit">Update password</button>
</form>
{% endblock %}
