{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="{% if not user %}guest-error{% else %}narrow{% endif %}">
  <p class="kicker">Fieldbook</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if user %}
  <a class="btn" href="/">Back to the dashboard</a>
  {% else %}
  <a class="btn" href="/login">Sign in</a>
  {% endif %}
</section>
{% endblock %}
