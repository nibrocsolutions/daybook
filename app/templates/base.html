<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14281f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Daybook{% endblock %} · {{ business_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body class="{% if user %}signed-in{% else %}guest{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  {% if user %}
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="workspace">
      <div class="mobile-bar">
        <button type="button" class="icon-btn" data-nav-toggle aria-expanded="false" aria-controls="sidebar" aria-label="Open menu">Menu</button>
        <strong>{{ business_name }}</strong>
      </div>
      <button type="button" class="scrim" data-nav-close aria-label="Close menu"></button>
      <main id="main">
        {% include "partials/flash.html" %}
  {% else %}
      <main id="main">
  {% endif %}
        {% block content %}{% endblock %}
  {% if user %}
      </main>
    </div>
  </div>
  {% else %}
      </main>
  {% endif %}
</body>
</html>
